<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400;600&display=optional" rel="stylesheet">
  <link rel="stylesheet" href="src/css/css-reset.css">
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="icon" type="image/x-png" href="/res/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/d5effce557.js" crossorigin="anonymous"></script>
  <title>Hugh Scott | WebShell</title>
</head>

<body>
  <main id="main">
    <div id="bars">
      <div id="bar-1">
        <span class="nixos-logo" aria-label="NixOS logo" role="img">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="window-title">NixOS · GNOME</span>
        <span class="window-controls" aria-hidden="true">
          <span class="window-control close"></span>
          <span class="window-control minimize"></span>
          <span class="window-control zoom"></span>
        </span>
      </div>
      <div id="bar-2"></div>
      <div id="bar-3"></div>
      <div id="bar-4"></div>
      <div id="bar-5"></div>
    </div>
    <br>
    <div id="terminal">
      <div class="prompt-entry">
        <div id="prompt-template" class="shell-prompt"></div>
      </div>
      <!-- command output will be inserted before #write-lines-->
      <a id="write-lines"></a>
    </div>
    <div id="input-line">
      <div>
        <p id="password-input" style="display: none;">Password: <input id="password-field" autocomplete="off"
            type="password" /></p>
        <div id="input-hidden" class="prompt-entry">
          <div id="active-prompt" class="shell-prompt"></div>
        </div>
      </div>
      <br>
    </div>
  </main>
</body>

<script type="module" src="./src/styles.ts"></script>
<script type="module" src="./src/main.ts"></script>

</html>
